<!DOCTYPE html>
<html lang="en" x-data="{ darkMode: localStorage.getItem('darkMode') === 'true' }" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - MLGCRA</title>
    <link rel="preload" as="style" href="https://mlgcra.gov.gh/build/assets/app-ZeufHT-R.css" /><link rel="preload" as="style" href="https://mlgcra.gov.gh/build/assets/app-CRXejzhy.css" /><link rel="modulepreload" href="https://mlgcra.gov.gh/build/assets/app-DmWcvEsc.js" /><link rel="modulepreload" href="https://mlgcra.gov.gh/build/assets/vendor-DfaEbejj.js" /><link rel="stylesheet" href="https://mlgcra.gov.gh/build/assets/app-ZeufHT-R.css" /><link rel="stylesheet" href="https://mlgcra.gov.gh/build/assets/app-CRXejzhy.css" /><script type="module" src="https://mlgcra.gov.gh/build/assets/app-DmWcvEsc.js"></script>    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex items-center justify-center">
    
    <div class="max-w-md w-full mx-4">
        <!-- Logo and Header -->
        <div class="text-center mb-8">
            <a href="https://mlgcra.gov.gh" class="flex items-center gap-3 group">
                                            <img src="https://mlgcra.gov.gh/storage/settings/QVpDE5GrBe7B2LtOaY0zrSAfaClAPYl3cTlhI3kt.png" alt="MLGCRA" class="h-16 transition-transform group-hover:scale-110">
                                </a>
            <h1 class="text-3xl font-bold text-gray-900 dark:text-white">MLGCRA</h1>
            <p class="text-gray-600 dark:text-gray-400 mt-2">Staff Portal Login</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl p-8">
            
            <!-- Session Status -->
            
            <!-- Geofence Notice -->
            <div class="mb-6 bg-blue-50 dark:bg-blue-900 border-l-4 border-blue-500 p-4 rounded">
                <div class="flex items-start">
                    <i class="fas fa-map-marker-alt text-blue-500 mt-1 mr-3"></i>
                    <div class="text-sm text-blue-700 dark:text-blue-200">
                        <p class="font-semibold mb-1">Location Verification Required</p>
                        <p>For security, you must be within an authorized ministry location to access the system.</p>
                    </div>
                </div>
            </div>

            <form method="POST" action="https://mlgcra.gov.gh/login" x-data="loginForm()">
                <input type="hidden" name="_token" value="j5YJnLDbXRFaXNhB8crHjeKFE20JS0f97CIzKO4v" autocomplete="off">
                <!-- Hidden location fields -->
                <input type="hidden" name="latitude" x-model="latitude">
                <input type="hidden" name="longitude" x-model="longitude">

                <!-- Email -->
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 dark:text-gray-300 font-semibold mb-2">
                        Email Address
                    </label>
                    <input id="email" 
                           type="email" 
                           name="email" 
                           value="" 
                           required 
                           autofocus
                           class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 dark:bg-gray-700 dark:text-white">
                                    </div>

                <!-- Password -->
                <div class="mb-4">
                    <label for="password" class="block text-gray-700 dark:text-gray-300 font-semibold mb-2">
                        Password
                    </label>
                    <input id="password" 
                           type="password" 
                           name="password" 
                           required
                           class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 dark:bg-gray-700 dark:text-white">
                                    </div>

                <!-- Remember Me -->
                <div class="mb-6 flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" name="remember" class="rounded border-gray-300 text-green-600 focus:ring-green-500">
                        <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">Remember me</span>
                    </label>

                    <a href="https://mlgcra.gov.gh/forgot-password" class="text-sm text-green-600 hover:text-green-700 dark:text-green-400">
                        Forgot password?
                    </a>
                </div>

                <!-- Location Error -->
                
                <!-- Location Status -->
                <div x-show="locationError" class="mb-4 bg-yellow-100 dark:bg-yellow-900 border border-yellow-400 text-yellow-700 dark:text-yellow-200 px-4 py-3 rounded">
                    <p x-text="locationError"></p>
                </div>

                <!-- Submit Button -->
                <button type="submit" 
                        x-bind:disabled="!locationGranted"
                        class="w-full bg-green-600 hover:bg-green-700 disabled:bg-gray-400 text-white font-semibold py-3 rounded-lg transition duration-200">
                    <span x-show="!locationGranted">
                        <i class="fas fa-spinner fa-spin mr-2"></i>
                        Getting Location...
                    </span>
                    <span x-show="locationGranted">
                        <i class="fas fa-sign-in-alt mr-2"></i>
                        Sign In
                    </span>
                </button>
            </form>

            <!-- Back to Home -->
            <div class="mt-6 text-center">
                <a href="https://mlgcra.gov.gh" class="text-sm text-gray-600 dark:text-gray-400 hover:text-green-600">
                    <i class="fas fa-arrow-left mr-1"></i>
                    Back to Homepage
                </a>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-gray-600 dark:text-gray-400 text-sm mt-6">
            &copy; 2026 Ministry of Local Government, Chieftaincy and Religious Affairs
        </p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    
    <script>
        function loginForm() {
            return {
                latitude: null,
                longitude: null,
                locationGranted: false,
                locationError: null,

                init() {
                    this.getLocation();
                },

                getLocation() {
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(
                            (position) => {
                                this.latitude = position.coords.latitude;
                                this.longitude = position.coords.longitude;
                                this.locationGranted = true;
                                this.locationError = null;
                            },
                            (error) => {
                                this.locationGranted = true; // Allow login but location will be null
                                switch(error.code) {
                                    case error.PERMISSION_DENIED:
                                        this.locationError = "Location access denied. You may not be able to access certain features.";
                                        break;
                                    case error.POSITION_UNAVAILABLE:
                                        this.locationError = "Location information unavailable.";
                                        break;
                                    case error.TIMEOUT:
                                        this.locationError = "Location request timed out.";
                                        break;
                                }
                            }
                        );
                    } else {
                        this.locationGranted = true;
                        this.locationError = "Geolocation is not supported by your browser.";
                    }
                }
            }
        }
    </script>
</body>
</html>
