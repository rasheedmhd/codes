<!doctype html>
<html class="no-js" lang="en">

<head>
<meta charset="utf-8">
<title>LOGIN - cp.mlgcra.gov.gh - Mlgcra Control Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="alternate icon" href="/images/favicon.png" type="image/png">
<link rel="icon" href="/images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/themes/default.min.css?v=1.9.4">

<link rel="stylesheet" href="/css/themes/dark.min.css?v=1.9.4"><script defer src="/js/dist/main.min.js?v=1.9.4"></script>
<script defer src="/js/dist/alpinejs-collapse.min.js?v=1.9.4"></script>
<script defer src="/js/dist/alpinejs.min.js?v=1.9.4"></script>
<script>
	document.documentElement.classList.replace('no-js', 'js');
	document.addEventListener('alpine:init', () => {
		Alpine.store('globals', {
			USER_PREFIX: '_',
			UNLIMITED: 'Unlimited',
			NOTIFICATIONS_EMPTY: 'No notifications',
			NOTIFICATIONS_DELETE_ALL: 'Delete all notifications',
			CONFIRM_LEAVE_PAGE: 'Are you sure you want to leave the page?',
			ERROR_MESSAGE: '',
			BLACKLIST: 'BLACKLIST',
			IPVERSE: 'IPVERSE'
		});
	})
</script>

</head>

<body class="page-login lang-en">
	<div class="app">
<div class="login">
	<a href="/" class="u-block u-mb40">
		<img src="/images/logo.svg" alt="Mlgcra Control Panel" width="100" height="120">
	</a>
	<form id="login-form" method="post" action="/login/">
		<input type="hidden" name="token" value="fa3178f6d5dbf6e51d7c19d402816ce7">
		<h1 class="login-title">
			Welcome to Mlgcra Control Panel		</h1>
				<div class="u-mb20">
			<label for="username" class="form-label">Username</label>
			<input type="text" class="form-control" name="user" id="username" autocomplete="username" required autofocus>
		</div>
		<button type="submit" class="button">
			<i class="fas fa-right-to-bracket"></i>Next		</button>
	</form>
</div>
	</div> 
</body>
</html>
